<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Your HTML here -->
    <header>
        <img src="assets/parrot.png" alt="parrot image">
        <div>
            <h1>PollyGlot</h1>
            <p>Perfect Translation Every Time</p>
        </div>
    </header>
    <main>
        <h2>Text to translate 👇</h2>
        <textarea rows="5" cols="80" id="text" name="text" autofocus>It was a dark and stormy night...</textarea>
        <h2>Select language 👇</h2>
        <div class="language-radio-btns">
            <div>
                <input type="radio" id="hindi" name="lang" value="hindi" checked>
                <label for="hindi">Hindi</label>
            </div>
            <div>
                <input type="radio" id="french" name="lang" value="french">
                <label for="french">French</label>
            </div>

            <div>
                <input type="radio" id="spanish" name="lang" value="spanish">
                <label for="spanish">Spanish</label>
            </div>
        </div>
        <button type="button">Translate</button>
    </main>
    <script src="index.js" type="module"></script>
</body>

</html>
